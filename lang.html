<div class="dep-head"><strong id="title">语言设置</strong></div>
<div class="mine-lang" id="rows"></div>
</main>

<a href="#cs" data-cs><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2z"/><path d="M20 12v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z"/><path d="M9 19a3 3 0 0 0 6 0"/></svg>客服</a>

</nav>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script>
requireLogin();
whenSite(function (d) {
  var rows = (d && d.langs && d.langs.length) ? d.langs : [{ code: "zh-CN", name: "简体中文", is_default: "1" }];
  var current = (window.LANG && window.LANG.code) || "";
  document.getElementById("title").textContent = t("lang_title");
  document.title = t("lang_title");
  var box = document.getElementById("rows");
  rows.forEach(function (row) {
    var btn = document.createElement("button");
    btn.type = "button";
    if (row.icon) {
      var img = document.createElement("img");
      img.alt = "";
      img.src = window.fileUrl(row.icon);
      btn.appendChild(img);
    }
    var name = document.createElement("span");
    name.textContent = row.name || row.code;
    btn.appendChild(name);
    if (row.code === current) btn.className = "on";
    btn.onclick = function () {
      localStorage.setItem("member-lang", row.code || "zh-CN");
      localStorage.setItem("member-lang-picked", "1");
      location.href = "home.html";
    };
    box.appendChild(btn);
  });
  document.body.classList.add("ready");
});
</script>
</body>
</html>
