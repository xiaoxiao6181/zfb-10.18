<h1>理财产品</h1>

<table><thead><tr><th>名称</th><th>年化%</th><th>期限</th><th>限额</th><th>可购等级</th><th>提前赎回</th><th></th></tr></thead><tbody></tbody></table>

<p class="msg" id="msg"></p>
</main>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script>

requireLogin();
whenSite(function () {
api("/api/app/products").then(function (res) {
  var tb = document.querySelector("tbody");
  if (res.code) { showMsg("msg", res); document.body.classList.add("ready"); return; }
  (res.data || []).forEach(function (row) {
    var tr = document.createElement("tr");
    var levels = (row.level_list || []).map(function (lv) { return langName("level", lv.id, lv.name); }).join("、") || row.level_names;
    [langName("product", row.id, row.name), row.rate, row.term_text || (row.term_days + "天"), money(row.min_amount) + " - " + money(row.max_amount), levels, row.allow_early_text].forEach(function (v) { tr.appendChild(cell(v)); });
    var td = document.createElement("td");
    var a = document.createElement("a");
    a.href = "product.html?id=" + row.id;
    a.textContent = row.level_allowed ? "查看" : "等级不符";
    td.appendChild(a);
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  document.body.classList.add("ready");
});
});

</script>
