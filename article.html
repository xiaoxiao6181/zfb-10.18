<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="style.css?v=news1">
</head>
<body class="dep wait">
<main>
<div class="dep-head">
<a class="art-back" href="articles.html" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></a>
<strong data-k="newsTitle"></strong>
</div>
<article class="art-read" id="sheet" hidden>
<h1 id="title"></h1>
<time id="when"></time>
<div class="art-html" id="body"></div>
</article>
<p class="wd-empty" id="msg" hidden></p>
</main>
<nav class="mh-tab">
<a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>首页</a>
<a href="recharge.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>存款</a>
<a href="#cs" data-cs><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2z"/><path d="M20 12v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z"/><path d="M9 19a3 3 0 0 0 6 0"/></svg>客服</a>
<a href="withdraw.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 15h4"/></svg>ATM</a>
<a class="on" href="mine.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.2-3 3.4-4.5 7-4.5S17.8 16 19 19"/></svg>我的</a>
</nav>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script src="page-text.js?v=3"></script>
<script>
requireLogin();
function whenText(raw) {
  return String(raw || "").replace("T", " ").slice(0, 19);
}
function fail(text) {
  var msg = document.getElementById("msg");
  msg.hidden = false;
  msg.textContent = text;
  document.body.classList.add("ready");
}
whenSite(function () {
  paintKeys();
  document.title = pageLine("newsTitle");
  var id = (location.search.match(/[?&]id=(\d+)/) || [])[1] || "";
  var lang = (window.LANG && window.LANG.code) || "zh-CN";
  api("/api/app/article?id=" + id + "&lang=" + encodeURIComponent(lang)).then(function (res) {
    if (!res || res.code) { fail(pageMsg((res && res.msg) || "加载失败")); return; }
    var d = res.data || {};
    document.title = d.title || pageLine("newsTitle");
    document.getElementById("title").textContent = d.title || pageLine("newsTitle");
    document.getElementById("when").textContent = whenText(d.created_at);
    var box = document.getElementById("body");
    if (d.cover) {
      var cover = document.createElement("img");
      cover.className = "art-cover";
      cover.src = window.fileUrl(d.cover);
      cover.alt = "";
      document.getElementById("sheet").insertBefore(cover, box);
    }
    var html = document.createElement("div");
    html.innerHTML = d.body || "";
    Array.prototype.forEach.call(html.querySelectorAll("img"), function (img) {
      img.src = window.fileUrl(img.getAttribute("src"));
    });
    while (html.firstChild) box.appendChild(html.firstChild);
    document.getElementById("sheet").hidden = false;
    document.body.classList.add("ready");
  }, function () { fail(pageLine("loadFail")); });
});
</script>
</body>
</html>
