<!DOCTYPE html>
<html lang="zh-CN" class="ld-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html { background: #eceff3; }
html.ld-wait body { visibility: hidden; }
* { box-sizing: border-box; }
body.land { margin: 0; background: #eceff3; color: #3a3a3a; font: 14px/1.7 "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.ld { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
.ld-nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 14px; background: #fff; border-bottom: 1px solid #f0f0f0; }
.ld-logo { display: flex; align-items: center; justify-content: flex-start; color: #111; font-weight: 700; font-size: 18px; text-align: left; }
.ld-links { display: flex; align-items: center; gap: 16px; color: #222; font-size: 15px; }
.ld-links button { margin: 0; padding: 4px; border: 0; background: transparent; cursor: pointer; }
.ld-lang { position: relative; }
.ld-lang-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
.ld-lang-btn img { width: 22px; height: 16px; object-fit: cover; border-radius: 2px; display: block; }
.ld-langs { position: absolute; inset-inline-end: 0; top: 36px; z-index: 6; width: 168px; max-height: 280px; overflow: auto; background: #fff; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
.ld-langs[hidden] { display: none; }
.ld-langs button { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0; padding: 10px 12px; border: 0; border-bottom: 1px solid #f4f4f4; background: #fff; color: #222; text-align: start; }
.ld-langs button.on { color: #1677ff; font-weight: 700; }
.ld-langs img { width: 22px; height: 16px; object-fit: cover; border-radius: 2px; }
.ld-hero { background: #16324f; }
.ld-hero img { width: 100%; height: auto; display: block; }
.ld-shot { margin: 20px 0 8px; text-align: center; }
.ld-shot img { width: min(300px, 86%); height: auto; display: inline-block; }
.ld h2 { margin: 36px 0 18px; text-align: center; color: #8d8d8d; font-size: 22px; font-weight: 500; }
.ld h3 { margin: 8px 0 22px; text-align: center; color: #1677ff; font-size: 22px; font-weight: 500; }
.ld-copy { margin: 0; padding: 0 28px 8px; color: #8a8a8a; font-size: 14px; text-align: justify; }
.icons { display: flex; justify-content: space-around; padding: 6px 18px 28px; }
.icons a, .icons div { width: 88px; text-align: center; color: #555; font-size: 13px; }
.icons img { width: 64px; height: 64px; margin: 0 auto 8px; display: block; object-fit: cover; border-radius: 16px; }
.icons img.round { border-radius: 50%; }
.ld-foot { padding: 22px 18px 28px; background: #2f2f2f; color: #d7d7d7; font-size: 13px; }
.ld-foot h2 { margin: 0 0 12px; color: #fff; text-align: start; font-size: 16px; }
.ld-foot p { margin: 0 0 8px; }
.ld-badge { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.ld-badge i { width: 18px; height: 18px; border-radius: 50%; background: #d23b3b; }
#duty-note { margin: 0; padding: 8px 14px; background: #fff7e8; color: #9a3412; }
</style>
</head>
<body class="land">
<main class="ld" id="top">
<nav class="ld-nav">
<a class="ld-logo" href="#top"><span data-k="brand"></span></a>
<div class="ld-links">
<a href="index.html?stay=1&tab=reg" data-k="open"></a>
<a href="index.html?stay=1&tab=login" data-k="login"></a>
<a href="#contact" data-cs data-k="service"></a>
<div class="ld-lang">
<button type="button" class="ld-lang-btn" id="ld-lang" aria-label=""><svg id="ld-lang-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#222" stroke-width="1.6"></circle><path d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9s1.3-6.2 3.8-9z" fill="none" stroke="#222" stroke-width="1.6"></path></svg><img id="ld-lang-flag" alt="" hidden></button>
<div class="ld-langs" id="ld-langs" hidden></div>
</div>
</div>
</nav>
<div class="ld-hero"><img data-file="/uploads/land/hero.png" alt=""></div>
<section id="about">
<h2 data-k="about"></h2>
<p class="ld-copy" data-k="p1"></p>
<p class="ld-copy" data-k="p2"></p>
</section>
<section id="products">
<h2 data-k="products"></h2>
<p class="ld-shot" id="huabei"><img data-file="/uploads/land/huabei.png" alt=""></p>
<h3 data-k="huabei"></h3>
<div class="icons">
<a href="index.html?stay=1&tab=reg"><img data-file="/uploads/land/ant.png" alt=""><span data-k="ant"></span></a>
<a href="index.html?stay=1&tab=reg"><img data-file="/uploads/land/yuebao.png" alt=""><span data-k="yuebao"></span></a>
<a href="index.html?stay=1&tab=reg"><img data-file="/uploads/land/yulibao.png" alt=""><span data-k="yulibao"></span></a>
</div>
<p class="ld-shot" id="jiebei"><img data-file="/uploads/land/jiebei.png" alt=""></p>
<h3 data-k="jiebei"></h3>
<div class="icons">
<div><img class="round" data-file="/uploads/land/borrow.png" alt=""><span data-k="borrow"></span></div>
<div><img class="round" data-file="/uploads/land/fast.png" alt=""><span data-k="fast"></span></div>
<div><img class="round" data-file="/uploads/land/daily.png" alt=""><span data-k="daily"></span></div>
</div>
</section>
<footer class="ld-foot" id="contact">
<h2 data-k="contact"></h2>
<p data-k="hotline"></p>
<p data-k="address"></p>
<p class="ld-badge"><i></i><span data-k="police"></span></p>
<p data-k="icp"></p>
<p data-k="copy"></p>
</footer>
</main>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script src="land-text.js?v=4"></script>
</body>
</html>
