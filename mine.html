<script>loadJs("common.js");</script>
<script>
requireLogin();
function add(a, b) {
  var x = Math.round(Number(a) * 100);
  var y = Math.round(Number(b) * 100);
  if (!isFinite(x)) x = 0;
  if (!isFinite(y)) y = 0;
  return ((x + y) / 100).toFixed(2);
}
function paintLogo(d) {
  var box = document.getElementById("logo");
  box.textContent = "";
  if (d && d.logo_front) {
    var img = document.createElement("img");
    img.alt = "";
    img.src = window.fileUrl(d.logo_front);
    box.appendChild(img);
    return;
  }
  var mark = document.createElement("span");
  mark.textContent = String((d && d.site_name) || "会").slice(0, 1);
  box.appendChild(mark);
}
var seen = { me: false, hold: false, site: false };
var wallet = "0.00";
var bag = "0.00";
function showPage(part) {
  seen[part] = true;
  if (seen.me && seen.hold && seen.site) {
    document.getElementById("asset").textContent = money(add(wallet, bag));
    document.body.classList.add("ready");
  }
}
whenSite(function (d) {
  document.getElementById("lab-account").textContent = t("mine_account");
  document.getElementById("lab-level").textContent = t("mine_level");
  document.getElementById("lab-asset").textContent = t("asset");
  document.getElementById("lab-score").textContent = t("score");
  paintLogo(d || {});
  var dl = document.getElementById("app-dl");
  var url = d && d.app_download ? String(d.app_download) : "";
  if (/^https?:\/\//i.test(url)) {
    dl.href = url;
    dl.target = "_blank";
    dl.rel = "noopener";
  } else {
    dl.addEventListener("click", function (e) { e.preventDefault(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-mine]"), function (el) {
    el.hidden = !!(d && d[el.getAttribute("data-mine")] === "0");
  });
  showPage("site");
});
api("/api/app/me").then(function (res) {
  var d = (!res || res.code) ? {} : (res.data || {});
  document.getElementById("name").textContent = d.username || "—";
  document.getElementById("uid").textContent = t("mine_id") + ": " + (d.uid || "—");
  document.getElementById("level").textContent = langName("level", d.level_id, d.level_name) || "—";
  document.getElementById("score").textContent = d.credit_score == null || d.credit_score === "" ? "100" : String(d.credit_score);
  wallet = d.available || "0";
  showPage("me");
});
api("/api/app/mails").then(function (res) {
  var rows = (!res || res.code) ? [] : (res.data || []);
  var n = 0;
  rows.forEach(function (row) { if (Number(row.read) !== 1) n += 1; });
  var badge = document.getElementById("mail-badge");
  if (!badge || n < 1) return;
  badge.textContent = n > 99 ? "99+" : String(n);
  badge.classList.add("on");
});
api("/api/app/holdings").then(function (res) {
  var rows = (!res || res.code) ? [] : (res.data || []);
  var sum = "0.00";
  rows.forEach(function (row) {
    if (row.status === "holding" || row.status === "redeem_pending") sum = add(sum, row.amount || "0");
  });
  bag = sum;
  showPage("hold");
});
</script>
