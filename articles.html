<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script src="page-text.js?v=3"></script>
<script>
requireLogin();
function whenText(raw) {
  return String(raw || "").replace("T", " ").slice(0, 19);
}
function note(text) {
  var p = document.createElement("p");
  p.className = "wd-empty";
  p.textContent = text;
  document.getElementById("rows").appendChild(p);
}
whenSite(function () {
  paintKeys();
  document.title = pageLine("newsTitle");
  var lang = (window.LANG && window.LANG.code) || "zh-CN";
  api("/api/app/articles?lang=" + encodeURIComponent(lang)).then(function (res) {
    var box = document.getElementById("rows");
    var rows = (!res || res.code) ? null : (res.data || []);
    if (!rows) note(pageMsg((res && res.msg) || "加载失败"));
    else if (!rows.length) note(pageLine("emptyNews"));
    else rows.forEach(function (row) {
      var card = document.createElement("a");
      card.className = "art-card";
      card.href = "article.html?id=" + row.id;
      var title = document.createElement("strong");
      title.textContent = row.title || pageLine("newsTitle");
      var time = document.createElement("time");
      time.textContent = whenText(row.created_at);
      card.appendChild(title);
      card.appendChild(time);
      if (row.cover) {
        var img = document.createElement("img");
        img.src = window.fileUrl(row.cover);
        img.alt = "";
        card.appendChild(img);
      }
      box.appendChild(card);
    });
    document.body.classList.add("ready");
  }, function () {
    note(pageLine("loadFail"));
    document.body.classList.add("ready");
  });
});
</script>
</body>
</html>
