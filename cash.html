<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="style.css?v=bar1">
</head>
<body class="dep wait">
<main>
<div class="dep-head"><strong data-k="cashRecords"></strong></div>
<section class="wd-list"><div id="rows"></div></section>
</main>
<nav class="mh-tab">
<a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>首页</a>
<a href="recharge.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>存款</a>
<a href="#cs" data-cs><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2z"/><path d="M20 12v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z"/><path d="M9 19a3 3 0 0 0 6 0"/></svg>客服</a>
<a href="withdraw.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 15h4"/></svg>ATM</a>
<a class="on" href="mine.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.2-3 3.4-4.5 7-4.5S17.8 16 19 19"/></svg>我的</a>
</nav>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script src="page-text.js?v=4"></script>
<script>
requireLogin();
function line(label, value) {
  var p = document.createElement("p");
  var span = document.createElement("span");
  span.textContent = label;
  var b = document.createElement("b");
  b.textContent = value == null || value === "" ? "—" : String(value);
  p.appendChild(span);
  p.appendChild(b);
  return p;
}
function arriveText(row) {
  if (row.pay_amount) return String(row.pay_amount) + (row.currency ? " " + row.currency : "");
  return money(row.amount);
}
function maskNo(raw) {
  var s = String(raw || "").replace(/\s+/g, "");
  if (!s) return "";
  if (s.length <= 8) return s.length <= 2 ? "****" : s.slice(0, 1) + "****" + s.slice(-1);
  return s.slice(0, 4) + "****" + s.slice(-4);
}
whenSite(function () {
  paintKeys();
  document.title = pageLine("cashRecords");
  api("/api/app/withdraws").then(function (res) {
  var box = document.getElementById("rows");
  var rows = (!res || res.code) ? null : (res.data || []);
  if (!rows) {
    var fail = document.createElement("p");
    fail.className = "wd-empty";
    fail.textContent = pageMsg((res && res.msg) || "加载失败");
    box.appendChild(fail);
  } else if (!rows.length) {
    var empty = document.createElement("p");
    empty.className = "wd-empty";
    empty.textContent = pageLine("empty");
    box.appendChild(empty);
  } else {
    rows.forEach(function (row) {
      var item = document.createElement("div");
      item.className = "wd-item";
      item.appendChild(line(pageLine("orderNo"), row.order_no || row.id));
      item.appendChild(line(pageLine("submitAmt"), money(row.amount)));
      if (!window.SITE || window.SITE.wd_got !== "0") item.appendChild(line(pageLine("wdGot"), arriveText(row)));
      item.appendChild(line(pageLine("holder"), row.holder_name));
      item.appendChild(line(pageLine("card"), maskNo(row.card_no)));
      item.appendChild(line(pageLine("status"), pageMsg(row.status_text)));
      item.appendChild(line(pageLine("time"), row.created_at));
      if (row.status === "rejected") item.appendChild(line(pageLine("reject"), row.audit_remark || ""));
      box.appendChild(item);
    });
  }
  document.body.classList.add("ready");
  });
});
</script>
</body>
</html>
