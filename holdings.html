<h1>我的持仓</h1>

<table><thead><tr><th>订单号</th><th>产品</th><th>本金</th><th>到期收益</th><th>提前收益</th><th>到期时间</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>

<p class="msg" id="msg"></p>
</main>
<script src="config.js"></script>
<script>loadJs("common.js");</script>
<script>

requireLogin();
function load() {
  whenSite(function () {
  api("/api/app/holdings").then(function (res) {
    var tb = document.querySelector("tbody");
    tb.innerHTML = "";
    if (res.code) { showMsg("msg", res); document.body.classList.add("ready"); return; }
    (res.data || []).forEach(function (row) {
      var tr = document.createElement("tr");
      [row.order_no || "未记录", langName("product", row.product_id, row.product_name), money(row.amount), money(row.expected_profit), money(row.early_profit), row.mature_at, row.status_text].forEach(function (v) { tr.appendChild(cell(v)); });
      var td = document.createElement("td");
      if (row.status === "holding") {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "赎回";
        btn.onclick = function () {
          api("/api/app/redeem", { holding_id: row.id }).then(function (r) { showMsg("msg", r); load(); });
        };
        td.appendChild(btn);
      }
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    document.body.classList.add("ready");
  });
  });
}
load();

</script>
