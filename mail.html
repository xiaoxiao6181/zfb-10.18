<script>loadJs("common.js");</script>
<script src="page-text.js?v=3"></script>
<script>
requireLogin();
function whenText(raw) {
  return String(raw || "").replace("T", " ").slice(0, 19);
}
function fail(text) {
  var msg = document.getElementById("msg");
  msg.hidden = false;
  msg.textContent = text;
  document.body.classList.add("ready");
}
whenSite(function () {
  paintKeys();
  document.title = pageLine("mailTitle");
  var id = (location.search.match(/[?&]id=(\d+)/) || [])[1] || "";
  var lang = (window.LANG && window.LANG.code) || "zh-CN";
  api("/api/app/mails?lang=" + encodeURIComponent(lang)).then(function (res) {
    var rows = (!res || res.code) ? [] : (res.data || []);
    var hit = null;
    rows.forEach(function (row) { if (String(row.id) === String(id)) hit = row; });
    if (!hit) { fail(pageLine("mailMissing")); return; }
    document.title = hit.title || pageLine("mailTitle");
    document.getElementById("title").textContent = hit.title || pageLine("mailTitle");
    document.getElementById("when").textContent = whenText(hit.created_at);
    document.getElementById("body").textContent = hit.body || "";
    document.getElementById("sheet").hidden = false;
    if (Number(hit.read) !== 1) api("/api/app/mail/read", { id: hit.id });
    document.body.classList.add("ready");
  }, function () { fail(pageLine("loadFail")); });
});
</script>
</body>
</html>
